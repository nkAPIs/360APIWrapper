[project]
name = "360apiwrapper"
version = "0.1.0"
description = "Public 360 API client and integration scripts"
requires-python = ">=3.13"
dependencies = [
    "nkconfighandler",
    "requests>=2.34.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Only package public360/ - not Doc/, REVOKED_TOKENS/ or the test scripts
[tool.setuptools.packages.find]
include = ["public360*"]

[tool.uv.sources]
nkconfighandler = { git = "https://github.com/nkCommon/nkConfigHandler.git" }
